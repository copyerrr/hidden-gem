<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>히든젬 — 관광지 추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="ai" role="tab" aria-selected="true">AI 추천</button>
        <button type="button" class="tab" data-tab="domestic" role="tab" aria-selected="false">내국인</button>
        <button type="button" class="tab" data-tab="foreign" role="tab" aria-selected="false">외국인</button>
        <button type="button" class="tab" data-tab="my" role="tab" aria-selected="false">마이</button>
      </nav>
      <div class="auth-bar">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="ko" id="langKo">KO</button>
          <button type="button" class="lang-btn" data-lang="en" id="langEn">EN</button>
        </div>
        <span id="authLabel" class="auth-label">로그인이 필요합니다</span>
        <button type="button" id="authOpenBtn" class="auth-btn">로그인 / 가입</button>
        <button type="button" id="logoutBtn" class="auth-btn" hidden>로그아웃</button>
      </div>
    </header>

    <!-- AI 추천 패널 -->
    <section id="panel-ai" class="panel active" role="tabpanel">
      <div class="panel-toolbar">
        <div class="region-wrap">
          <label for="sidoSelect">지역</label>
          <select id="sidoSelect">
            <option value="">전국</option>
          </select>
        </div>
        <div class="sort-wrap">
          <label for="sort">정렬</label>
          <select id="sort">
            <option value="gem">추천순</option>
            <option value="foreign">외국인 많은 순</option>
            <option value="domestic">내국인 많은 순</option>
          </select>
        </div>
      </div>

      <div id="status" class="status" hidden></div>
      <ul id="results" class="post-list"></ul>
    </section>

    <!-- 내국인 추천 = DB Post 피드 -->
    <section id="panel-domestic" class="panel" role="tabpanel" hidden>
      <div id="boardStatusDomestic" class="status" hidden></div>
      <ul id="boardListDomestic" class="thread-feed"></ul>
    </section>

    <!-- 외국인 추천 -->
    <section id="panel-foreign" class="panel" role="tabpanel" hidden>
      <div id="boardStatusForeign" class="status" hidden></div>
      <ul id="boardListForeign" class="thread-feed"></ul>
    </section>

    <!-- 마이페이지 -->
    <section id="panel-my" class="panel" role="tabpanel" hidden>
      <div class="my-header">
        <div class="my-avatar" id="myAvatar" aria-hidden="true">?</div>
        <div class="my-info">
          <p class="my-name" id="myName">게스트</p>
          <p class="my-sub" id="mySub">로그인하면 내 글·추천 목록을 볼 수 있어요</p>
        </div>
      </div>
      <div class="my-subtabs" role="tablist">
        <button type="button" class="my-subtab active" data-my-view="posts">내가 쓴 글</button>
        <button type="button" class="my-subtab" data-my-view="liked">추천한 글</button>
      </div>
      <div id="boardStatusMy" class="status" hidden></div>
      <ul id="boardListMy" class="thread-feed"></ul>
    </section>

    <button type="button" id="writeBtn" class="fab" title="글쓰기">글쓰기</button>
  </div>

  <!-- 로그인 / 회원가입 -->
  <dialog id="authDialog" class="modal">
    <form method="dialog" id="authForm" class="modal-card">
      <h2 id="authTitle">로그인</h2>
      <div class="auth-mode-tabs">
        <button type="button" class="auth-mode active" data-mode="login">로그인</button>
        <button type="button" class="auth-mode" data-mode="register">회원가입</button>
      </div>
      <label>아이디<input id="authMemberId" name="memberId" autocomplete="username" required></label>
      <label>비밀번호<input id="authPassword" name="password" type="password" autocomplete="current-password" required></label>
      <label id="authNickWrap" hidden>닉네임<input id="authNickname" name="nickname" placeholder="선택 (없으면 아이디)"></label>
      <p id="authError" class="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" id="authCancelBtn" class="btn-ghost">취소</button>
        <button type="submit" class="btn-primary" id="authSubmit">로그인</button>
      </div>
    </form>
  </dialog>

  <!-- 글쓰기 -->
  <dialog id="writeDialog" class="modal">
    <form method="dialog" id="writeForm" class="modal-card">
      <h2 id="writeTitle">글쓰기</h2>
      <label>게시판
        <select id="writeCategory" name="category">
          <option value="DOMESTIC">내국인 추천</option>
          <option value="FOREIGN">외국인 추천</option>
        </select>
      </label>
      <label>장소명<input id="writeLocation" name="locationTitle" placeholder="예: 부산시립미술관"></label>
      <label>주소<input id="writeAddress" name="address" placeholder="선택"></label>
      <label>사진
        <input id="writeImage" name="image" type="file" accept="image/*">
      </label>
      <div id="writeImagePreview" class="write-preview" hidden></div>
      <label>내용<textarea id="writeContent" name="content" rows="5" required placeholder="방문 후기나 추천 이유를 적어 주세요."></textarea></label>
      <p id="writeError" class="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" id="writeCancelBtn" class="btn-ghost">취소</button>
        <button type="submit" value="ok" class="btn-primary" id="writeSubmit">등록</button>
      </div>
    </form>
  </dialog>

  <!-- 게시글 상세 (추천·댓글) -->
  <dialog id="detailDialog" class="modal">
    <div class="modal-card detail-card">
      <button type="button" class="modal-close" id="detailClose" aria-label="닫기">×</button>
      <div id="detailBody"></div>
      <div class="detail-actions">
        <button type="button" id="recommendBtn" class="btn-primary">추천</button>
        <button type="button" id="editPostBtn" class="btn-ghost" hidden>수정</button>
        <button type="button" id="deletePostBtn" class="btn-danger" hidden>삭제</button>
      </div>
      <section class="replies">
        <h3>댓글</h3>
        <ul id="replyList" class="reply-list"></ul>
        <form id="replyForm" class="reply-form">
          <input id="replyInput" type="text" placeholder="댓글을 입력하세요" required>
          <button type="submit" class="btn-primary">등록</button>
        </form>
      </section>
    </div>
  </dialog>

  <!-- 관광지 상세 (설명·이용·근처) -->
  <dialog id="placeDialog" class="modal place-modal">
    <div class="place-sheet">
      <button type="button" class="modal-close place-close" id="placeClose" aria-label="닫기">×</button>
      <div id="placeBody" class="place-body">
        <div class="place-loading">불러오는 중…</div>
      </div>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
